<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f4f6fa" />
  <title>Γράφοι Κινεματικής</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230072B2'/%3E%3Cpath%20d='M4%2024C12%2024%2012%208%2028%208'%20stroke='white'%20stroke-width='3'%20fill='none'/%3E%3Ccircle%20cx='28'%20cy='8'%20r='3'%20fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <!-- Left column: plots and track -->
    <div class="left-col">
      <section class="plots-card card" aria-label="Γράφοι κίνησης">
        <div class="t1-bar">
          <span class="t1-title">Στη στιγμή t₁ — <b id="out-t1">5 s</b></span>
          <div id="readouts"></div>
          <button id="btn-reset" class="btn btn-ghost btn-sm t1-reset" title="Μετάβαση του t₁ στο t₀">Επιστροφή στο t₀</button>
        </div>

        <!-- Timeline: the one and only way to move t₁ (drag, or focus + arrow keys) -->
        <div class="timeline-row">
          <canvas id="timeline" class="timeline" role="slider" tabindex="0"
                  aria-label="Τρέχων χρόνος t₁ — σύρετε οριζόντια ή χρησιμοποιήστε τα βέλη"></canvas>
        </div>

        <div class="plot-row" id="row-x"><canvas id="plot-x" role="img" aria-label="Γράφος θέσης x ως προς t"></canvas></div>
        <div class="plot-row" id="row-u"><canvas id="plot-u" role="img" aria-label="Γράφος ταχύτητας u ως προς t"></canvas></div>
        <div class="plot-row" id="row-a"><canvas id="plot-a" role="img" aria-label="Γράφος επιτάχυνσης a ως προς t"></canvas></div>
      </section>

      <!-- Track (real movement on a line) -->
      <section class="card track-card" id="track-card" aria-label="Κίνηση σε ευθεία">
        <h2>Κίνηση σε ευθεία</h2>
        <canvas id="track" role="img" aria-label="Σώματα που κινούνται σε ευθεία"></canvas>
      </section>
    </div>

    <!-- Right column: controls -->
    <aside class="controls" aria-label="Ελεγχος">
      <div class="card">
        <h2>Γενικά</h2>
        <div class="param-grid">
          <label>t₀ (s)
            <input id="in-t0" type="text" value="0" inputmode="decimal" autocomplete="off" spellcheck="false" />
          </label>
        </div>
      </div>

      <div class="card">
        <h2>Σώματα</h2>
        <div id="objects-container"></div>
        <button id="btn-add-object" class="btn btn-primary">+ Προσθήκη σώματος</button>
      </div>

      <div class="card">
        <h2>Εμφάνιση</h2>
        <div class="chk-row">
          <label class="chk"><input type="checkbox" id="show-x" checked /> x(t)</label>
          <label class="chk"><input type="checkbox" id="show-u" checked /> u(t)</label>
          <label class="chk"><input type="checkbox" id="show-a" checked /> a(t)</label>
        </div>
        <div class="chk-row">
          <label class="chk"><input type="checkbox" id="show-track" /> Κίνηση σε ευθεία</label>
        </div>
        <label class="chk"><input type="checkbox" id="in-axis-zero" checked /> Άξονας t στο y = 0</label>
      </div>

      <div class="card">
        <h2>Κοινοποίηση</h2>
        <p class="note">Το σενάριο αποθηκεύεται αυτόματα σε αυτόν τον περιηγητή. Εξαγάγετε έναν κωδικό για κοινοποίηση ή επικολλήστε έναν παρακάτω για εισαγωγή.</p>
        <button id="btn-export" class="btn btn-primary">Εξαγωγή κωδικού</button>
        <textarea id="out-code" readonly rows="2" placeholder="…" aria-label="Κωδικός σεναρίου για κοινοποίηση"></textarea>
        <textarea id="in-code" rows="2" placeholder="Κωδικός σεναρίου…" aria-label="Κωδικός σεναρίου για εισαγωγή"></textarea>
        <button id="btn-import" class="btn btn-secondary">Εισαγωγή</button>
        <button id="btn-clear" class="btn btn-ghost">Επαναφορά στο προεπιλεγμένο σενάριο</button>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
